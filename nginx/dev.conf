# Minimal nginx config for docker-compose.dev.yml.
#
# Production nginx is native on the deploy server and NOT part of this repo
# (see docker-compose.production.yml's comments -- it stays untouched,
# reverse-proxying to the site container's uwsgi http-socket and serving
# /static, /media directly). uwsgi alone doesn't serve static files, so
# without this, pages would load with zero CSS/JS. This is a from-scratch
# stand-in, not a copy of the real server config.

server {
    listen 80;
    server_name localhost;
    # No cap configured on the Django/uwsgi side (no FILE_UPLOAD_MAX_MEMORY_SIZE
    # override in settings.py) -- this is the real limit for problem test-data
    # zip uploads etc. Bump further if a real package exceeds this.
    client_max_body_size 200m;

    location /static/ {
        alias /site/static/;
        # Dev only: production relies on far-future caching + content-hashed
        # filenames from django-compressor, which is correct there. Here,
        # `manage.py collectstatic` overwrites the same filenames in place
        # after every CSS/JS edit, so a cached response means the browser
        # never re-requests it -- force revalidation on every load instead.
        add_header Cache-Control "no-cache";
    }

    location /media/ {
        alias /media/;
    }

    location / {
        proxy_pass http://site:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
